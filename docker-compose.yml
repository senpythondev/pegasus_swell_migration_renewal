services:
  # ===== データベース (本番に合わせて MySQL 5.7) =====
  db:
    image: mysql:5.7
    container_name: pegasus_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass_change_me
      MYSQL_DATABASE: pegasus_wp
      MYSQL_USER: pegasus
      MYSQL_PASSWORD: pegasus_pass_change_me
    volumes:
      - db_data:/var/lib/mysql
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
    networks:
      - pegasus_net

  # ===== PHP + WordPress 本体 =====
  wordpress:
    image: wordpress:php8.1-fpm
    container_name: pegasus_wp
    restart: unless-stopped
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: pegasus_wp
      WORDPRESS_DB_USER: pegasus
      WORDPRESS_DB_PASSWORD: pegasus_pass_change_me
      # 本番と同じテーブル接頭辞に合わせる(重要)
      WORDPRESS_TABLE_PREFIX: wp04447a
      WORDPRESS_DEBUG: "0"
    volumes:
      - ./wp_data:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - pegasus_net

  # ===== Nginx (Webサーバー) =====
  nginx:
    image: nginx:latest
    container_name: pegasus_nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      # ホストの 8080 番ポートで公開(既存案件と衝突しないよう8080を使用)
      # ※ 当VPSは上位ファイアウォールで 8080 のみ外部許可。mailpitは 8080 のサブパス /mailpit/ で公開する。
      - "8080:80"
    volumes:
      - ./wp_data:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      # Basic認証(検収者限定)用の .htpasswd を読み取り専用でマウント
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - pegasus_net

  # ===== phpMyAdmin (DB操作用・任意) =====
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pegasus_pma
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 256M
    ports:
      # 外部非公開：ループバック限定(SSHトンネル経由でのみアクセス)
      - "127.0.0.1:8081:80"
    networks:
      - pegasus_net

  # ===== mailpit (テスト用SMTP・実配信せず捕捉) =====
  mailpit:
    image: axllent/mailpit:latest
    container_name: pegasus_mailpit
    restart: unless-stopped
    environment:
      # 検収用: nginx の /mailpit/ サブパス公開に合わせ、mailpit のUI/API/WebSocketを
      # /mailpit 配下で配信(アセットの絶対パス・WSがサブパス下でも正しく解決される)。
      MP_WEBROOT: /mailpit
    ports:
      # Web UI: 外部非公開・ループバック限定(SSHトンネル経由でのみアクセス)
      - "127.0.0.1:8025:8025"
      # SMTP(1025) はホスト公開を撤去。WordPress はコンテナ間通信 mailpit:1025 で送信するため不要。
    networks:
      - pegasus_net

volumes:
  db_data:

networks:
  pegasus_net:
    driver: bridge
