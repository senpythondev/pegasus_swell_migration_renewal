server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    # Docker のポートマッピング(ホスト8080→コンテナ80)環境では、nginx の自動リダイレクト
    # (ディレクトリ末尾スラッシュ追加 例: /wp-admin → /wp-admin/ など)が
    # 内部リッスンポート80で絶対URLを生成し、外部ポート :8080 が欠落して
    # http://220.158.21.114/wp-admin/(別システム)へ飛び 404 になる。
    # 相対リダイレクトに切り替え、ブラウザ側の host:port(:8080)を保持する。
    absolute_redirect off;

    # 大きなバックアップ復元のためアップロード上限を拡大
    client_max_body_size 512M;

    # ===== Basic認証(検収者限定) =====
    # サイト全体に適用。ブラウザは一度認証すると同一オリジンの
    # XHR/fetch(CF7のwp-json送信・admin-ajax)にも認証情報を自動付与するため、
    # 管理画面ログイン・フォーム送信は認証下でも正常動作する。
    auth_basic "Pegasus Staging (Kensho)";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # wp-cron は WordPress 自身のループバック要求(認証情報を持たない)で叩かれるため
    # Basic認証を免除し、スケジュール処理が止まらないようにする。
    location = /wp-cron.php {
        auth_basic off;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 600;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # docker-compose のサービス名 "wordpress" の 9000番(php-fpm)へ
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # 復元処理が長時間かかる場合に備えてタイムアウトを延長
        fastcgi_read_timeout 600;
    }

    location ~ /\.ht {
        deny all;
    }

    # 資料請求PDFの保護ディレクトリ：直アクセス禁止(配信は /download-secure/ 経由のみ)
    # ^~ で正規表現ロケーションより優先。PHP の readfile() はファイルシステム経由で読めるため配信は可能。
    location ^~ /wp-content/uploads/protected/ {
        deny all;
        return 404;
    }

    # 静的ファイルのキャッシュ
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        access_log off;
    }
}
